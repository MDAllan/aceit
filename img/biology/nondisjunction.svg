<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Nondisjunction can produce aneuploid gametes</title><desc id="desc">If chromosomes fail to separate during meiosis, some gametes receive an extra chromosome while others lack one.</desc>
<rect width="640" height="360" rx="24" fill="#241b32"/><text x="32" y="42" fill="#fff5ff" font-family="Arial" font-size="24" font-weight="700">When chromosomes fail to separate</text>
<text x="150" y="103" text-anchor="middle" fill="#ddd1e8" font-family="Arial" font-size="16">Normal separation</text><text x="468" y="103" text-anchor="middle" fill="#ddd1e8" font-family="Arial" font-size="16">Nondisjunction</text>
<circle cx="150" cy="180" r="45" fill="#54456b"/><path d="M138 163l12 15 12-15m-12 15v20m-18 25v-20m36 20v-20" stroke="#f1d082" stroke-width="5" fill="none"/>
<path d="M202 180h48m-12-9 12 9-12 9" stroke="#f0c77c" stroke-width="4" fill="none"/>
<g fill="#6b9b9e"><circle cx="290" cy="160" r="23"/><circle cx="344" cy="160" r="23"/><circle cx="290" cy="222" r="23"/><circle cx="344" cy="222" r="23"/></g>
<path d="M387 180h37m-12-9 12 9-12 9" stroke="#f0c77c" stroke-width="4" fill="none"/>
<g fill="#a45767"><circle cx="472" cy="160" r="24"/><circle cx="529" cy="160" r="24"/><circle cx="472" cy="222" r="24"/><circle cx="529" cy="222" r="24"/></g>
<g stroke="#ffe0a2" stroke-width="4"><path d="M462 150l20 20m0-20-20 20M519 150l20 20m0-20-20 20M462 212l20 20m0-20-20 20M519 212l20 20m0-20-20 20"/></g>
<text x="317" y="290" text-anchor="middle" fill="#dbe5e8" font-family="Arial" font-size="14">Normal gametes receive the expected chromosome set.</text><text x="500" y="318" text-anchor="middle" fill="#e6c6d1" font-family="Arial" font-size="14">Extra or missing chromosome → aneuploidy</text>
</svg>
