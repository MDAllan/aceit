<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Mitosis and meiosis produce different cells</title><desc id="desc">One diploid cell divides by mitosis to produce two diploid cells, or by meiosis to produce four haploid cells.</desc>
<rect width="640" height="360" rx="24" fill="#241b32"/><text x="32" y="42" fill="#fff5ff" font-family="Arial" font-size="24" font-weight="700">Two cell-division pathways</text>
<circle cx="92" cy="184" r="37" fill="#b376b4"/><text x="92" y="190" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">2n</text>
<path d="M137 184H203m-12-9 12 9-12 9" stroke="#f0c77c" stroke-width="4" fill="none"/>
<text x="167" y="157" text-anchor="middle" fill="#f3d996" font-family="Arial" font-size="14">mitosis</text>
<circle cx="253" cy="158" r="29" fill="#6ba6a2"/><circle cx="253" cy="220" r="29" fill="#6ba6a2"/><text x="253" y="163" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">2n</text><text x="253" y="225" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">2n</text>
<path d="M291 184H354m-12-9 12 9-12 9" stroke="#f0c77c" stroke-width="4" fill="none"/>
<text x="322" y="157" text-anchor="middle" fill="#f3d996" font-family="Arial" font-size="14">meiosis</text>
<g fill="#d78a6b"><circle cx="405" cy="143" r="23"/><circle cx="461" cy="143" r="23"/><circle cx="405" cy="222" r="23"/><circle cx="461" cy="222" r="23"/></g><g fill="#fff" font-family="Arial" font-size="12" text-anchor="middle"><text x="405" y="148">n</text><text x="461" y="148">n</text><text x="405" y="227">n</text><text x="461" y="227">n</text></g>
<text x="253" y="291" text-anchor="middle" fill="#dbe5e8" font-family="Arial" font-size="14">Two genetically similar diploid cells</text><text x="436" y="291" text-anchor="middle" fill="#dbe5e8" font-family="Arial" font-size="14">Four haploid gametes</text>
<text x="320" y="332" text-anchor="middle" fill="#c6b7d0" font-family="Arial" font-size="14">Mitosis supports growth; meiosis reduces chromosome number.</text>
</svg>
