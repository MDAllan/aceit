<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Skeletal muscle contraction sequence</title><desc id="desc">A nerve signal leads to calcium release, exposes actin binding sites, allows myosin to pull, and ATP supports detachment and relaxation.</desc>
<rect width="640" height="360" rx="24" fill="#201a34"/><text x="32" y="42" fill="#f6f1ff" font-family="Arial" font-size="24" font-weight="700">Signal → calcium → cross-bridge cycle</text>
<g font-family="Arial" text-anchor="middle"><rect x="30" y="112" width="104" height="100" rx="16" fill="#5c4c89"/><text x="82" y="150" fill="white" font-size="16">Motor</text><text x="82" y="174" fill="white" font-size="16">neuron</text>
<rect x="158" y="112" width="104" height="100" rx="16" fill="#705596"/><text x="210" y="150" fill="white" font-size="16">Ca²⁺</text><text x="210" y="174" fill="white" font-size="16">released</text>
<rect x="286" y="112" width="104" height="100" rx="16" fill="#98619a"/><text x="338" y="150" fill="white" font-size="16">Actin sites</text><text x="338" y="174" fill="white" font-size="16">exposed</text>
<rect x="414" y="112" width="104" height="100" rx="16" fill="#c66d8b"/><text x="466" y="150" fill="white" font-size="16">Myosin</text><text x="466" y="174" fill="white" font-size="16">pulls</text>
<rect x="542" y="112" width="70" height="100" rx="16" fill="#e69c83"/><text x="577" y="150" fill="#3b263c" font-size="16">ATP</text><text x="577" y="174" fill="#3b263c" font-size="13">release</text></g>
<path d="M135 162H154M263 162H282M391 162H410M519 162H538" fill="none" stroke="#f6d2a2" stroke-width="3"/>
<text x="320" y="267" text-anchor="middle" fill="#cbc3dd" font-family="Arial" font-size="16">Calcium removal and ATP-dependent steps allow the fibre to relax.</text>
</svg>
