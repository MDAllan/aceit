<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Three muscle tissue types</title><desc id="desc">Skeletal muscle is striated and voluntary, cardiac muscle is striated and connected, and smooth muscle is nonstriated and involuntary.</desc>
<rect width="640" height="360" rx="24" fill="#201a34"/><text x="32" y="42" fill="#f6f1ff" font-family="Arial" font-size="24" font-weight="700">Structure matches muscle function</text>
<g font-family="Arial" fill="#f7f2ff"><text x="80" y="106" font-size="18" font-weight="700">Skeletal</text><text x="294" y="106" font-size="18" font-weight="700">Cardiac</text><text x="500" y="106" font-size="18" font-weight="700">Smooth</text></g>
<g fill="#c66d8b"><rect x="54" y="128" width="154" height="48" rx="20"/><rect x="54" y="144" width="154" height="5" fill="#ffd1a2"/><rect x="54" y="163" width="154" height="5" fill="#ffd1a2"/>
<path d="M270 150h125m-76-20 27 20-27 20m45-20 24 20-24 20" fill="none" stroke="#db879c" stroke-width="14" stroke-linecap="round"/><path d="M321 130l12 40" stroke="#ffd1a2" stroke-width="4"/>
<path d="M477 150q60-37 117 0-57 37-117 0z" fill="#d89179"/></g>
<g fill="#cbc3dd" font-family="Arial" font-size="15" text-anchor="middle"><text x="131" y="219">Striated · voluntary</text><text x="131" y="243">Moves and stabilizes bones</text><text x="331" y="219">Striated · involuntary</text><text x="331" y="243">Pumps blood</text><text x="525" y="219">Nonstriated · involuntary</text><text x="525" y="243">Moves contents in organs</text></g>
</svg>
