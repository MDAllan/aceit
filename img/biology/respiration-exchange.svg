<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Gas exchange and cellular respiration</title><desc id="desc">Oxygen diffuses from alveolar air into blood and carbon dioxide diffuses into the alveolus; cells use oxygen to release energy from nutrients.</desc>
<rect width="640" height="360" rx="24" fill="#241b32"/><text x="32" y="42" fill="#fff5ff" font-family="Arial" font-size="24" font-weight="700">Respiration links lungs, blood, and cells</text>
<circle cx="152" cy="177" r="66" fill="#76568c" stroke="#e8c1f0" stroke-width="4"/><text x="152" y="172" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17">Alveolus</text><text x="152" y="195" text-anchor="middle" fill="#eee3f3" font-family="Arial" font-size="13">air space</text>
<rect x="280" y="129" width="125" height="96" rx="18" fill="#9b4d59"/><text x="342" y="170" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17">Blood</text><text x="342" y="194" text-anchor="middle" fill="#f5e1e4" font-family="Arial" font-size="13">capillary</text>
<path d="M224 159H272m-12-9 12 9-12 9" stroke="#8fe0ce" stroke-width="4" fill="none"/><text x="248" y="142" text-anchor="middle" fill="#a7ead9" font-family="Arial" font-size="13">O₂</text>
<path d="M272 199H224m12-9-12 9 12 9" stroke="#ffb28e" stroke-width="4" fill="none"/><text x="248" y="224" text-anchor="middle" fill="#ffc5a8" font-family="Arial" font-size="13">CO₂</text>
<path d="M411 177H473m-12-9 12 9-12 9" stroke="#8fe0ce" stroke-width="4" fill="none"/><text x="442" y="158" text-anchor="middle" fill="#a7ead9" font-family="Arial" font-size="13">O₂ delivered</text>
<rect x="481" y="135" width="126" height="84" rx="18" fill="#526f5d"/><text x="544" y="169" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">Body cells</text><text x="544" y="193" text-anchor="middle" fill="#e3efe4" font-family="Arial" font-size="13">nutrients → ATP</text>
<text x="320" y="308" text-anchor="middle" fill="#d6c6e0" font-family="Arial" font-size="14">Pulmonary gas exchange is distinct from cellular respiration.</text>
</svg>
