<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Two routes of bone formation</title><desc id="desc">Intramembranous ossification forms bone directly from mesenchymal tissue, while endochondral ossification replaces a cartilage model.</desc>
<rect width="640" height="360" rx="24" fill="#152a35"/><text x="32" y="42" fill="#f0fbff" font-family="Arial" font-size="24" font-weight="700">Two routes build bone</text>
<rect x="28" y="80" width="278" height="240" rx="18" fill="#203c49"/><rect x="334" y="80" width="278" height="240" rx="18" fill="#203c49"/>
<text x="167" y="114" text-anchor="middle" fill="#8de5f5" font-family="Arial" font-size="18" font-weight="700">Intramembranous</text><text x="473" y="114" text-anchor="middle" fill="#f5d18f" font-family="Arial" font-size="18" font-weight="700">Endochondral</text>
<g font-family="Arial" font-size="15" text-anchor="middle" fill="#f3f7fa"><rect x="62" y="145" width="210" height="42" rx="12" fill="#536976"/><text x="167" y="172">Mesenchymal tissue</text><path d="M167 188v24" stroke="#e8e7db" stroke-width="3"/><rect x="62" y="214" width="210" height="42" rx="12" fill="#4a8d87"/><text x="167" y="241">Osteoblasts form osteoid</text><path d="M167 257v20" stroke="#e8e7db" stroke-width="3"/><text x="167" y="300">Bone forms directly</text>
<rect x="368" y="145" width="210" height="42" rx="12" fill="#536976"/><text x="473" y="172">Cartilage model</text><path d="M473 188v24" stroke="#e8e7db" stroke-width="3"/><rect x="368" y="214" width="210" height="42" rx="12" fill="#b67e63"/><text x="473" y="241">Cartilage is replaced</text><path d="M473 257v20" stroke="#e8e7db" stroke-width="3"/><text x="473" y="300">Bone grows around / within</text></g>
</svg>
