<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Axial and appendicular skeleton</title><desc id="desc">The axial skeleton includes the skull, vertebral column, ribs, and sternum; the appendicular skeleton includes the limb girdles and limbs.</desc>
<rect width="640" height="360" rx="24" fill="#152a35"/><text x="32" y="42" fill="#f0fbff" font-family="Arial" font-size="24" font-weight="700">Two functional regions of the skeleton</text>
<g stroke="#ecf1f5" stroke-width="10" stroke-linecap="round" fill="none"><circle cx="320" cy="100" r="29"/><path d="M320 132v98m-42-67h84m-42 67-35 77m35-77 35 77M278 163l-50 74m134-74 50 74M293 161q27 18 54 0M299 181q21 14 42 0M302 202q18 14 36 0"/></g>
<path d="M466 97H586" stroke="#50cae4" stroke-width="3"/><text x="468" y="85" fill="#8de5f5" font-family="Arial" font-size="15">Axial: skull, spine, ribs, sternum</text>
<path d="M401 242H566" stroke="#f3b95d" stroke-width="3"/><text x="410" y="269" fill="#f5d18f" font-family="Arial" font-size="15">Appendicular: girdles and limbs</text>
<text x="320" y="330" fill="#cad7df" font-family="Arial" font-size="15" text-anchor="middle">Axial skeleton forms the central framework; appendicular skeleton enables movement.</text>
</svg>
