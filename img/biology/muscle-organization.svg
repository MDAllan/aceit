<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Skeletal muscle organization</title><desc id="desc">A hierarchy runs from whole muscle to fascicle to muscle fibre to myofibril to repeating sarcomere.</desc>
<rect width="640" height="360" rx="24" fill="#201a34"/><text x="32" y="42" fill="#f6f1ff" font-family="Arial" font-size="24" font-weight="700">Muscle is organized in nested levels</text>
<g font-family="Arial" text-anchor="middle"><rect x="30" y="112" width="112" height="94" rx="18" fill="#c94f67"/><text x="86" y="152" fill="white" font-size="17">Whole</text><text x="86" y="176" fill="white" font-size="17">muscle</text>
<rect x="158" y="112" width="112" height="94" rx="18" fill="#da6b6d"/><text x="214" y="164" fill="white" font-size="17">Fascicle</text>
<rect x="286" y="112" width="112" height="94" rx="18" fill="#e58a70"/><text x="342" y="152" fill="white" font-size="17">Muscle</text><text x="342" y="176" fill="white" font-size="17">fibre</text>
<rect x="414" y="112" width="94" height="94" rx="18" fill="#efaa7b"/><text x="461" y="164" fill="#39243c" font-size="17">Myofibril</text>
<rect x="524" y="112" width="88" height="94" rx="18" fill="#f4ce91"/><text x="568" y="152" fill="#39243c" font-size="16">Sarco-</text><text x="568" y="175" fill="#39243c" font-size="16">mere</text></g>
<g stroke="#d4c7eb" stroke-width="3" fill="none"><path d="M142 159H155M270 159H283M398 159H411M508 159H521"/></g>
<text x="320" y="260" text-anchor="middle" fill="#cbc3dd" font-family="Arial" font-size="16">Connective-tissue coverings support each larger bundle.</text>
</svg>
