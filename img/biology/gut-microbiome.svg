<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Gut microbiome and gut-brain signaling</title><desc id="desc">Microbes in the intestinal lumen interact with the gut barrier and can signal through nerves and chemical messengers along the gut-brain axis.</desc>
<rect width="640" height="360" rx="24" fill="#241b32"/><text x="32" y="42" fill="#fff5ff" font-family="Arial" font-size="24" font-weight="700">Gut microbes and host signaling</text>
<path d="M120 105c-40 25-35 67-4 74-31 16-28 68 8 73 37 4 41-45 12-60 31-15 26-55-1-60 34-18 23-45-15-27z" fill="#a96559" stroke="#f0c77c" stroke-width="4"/>
<text x="125" y="289" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">Intestinal lining</text>
<g><circle cx="237" cy="139" r="13" fill="#84c58e"/><circle cx="275" cy="177" r="10" fill="#df9e65"/><circle cx="234" cy="218" r="11" fill="#8fa3de"/><circle cx="292" cy="239" r="13" fill="#84c58e"/><circle cx="300" cy="119" r="9" fill="#df9e65"/></g>
<text x="266" y="289" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">Microbial community</text>
<path d="M324 184H414m-13-9 13 9-13 9" stroke="#a9e3ce" stroke-width="4" fill="none"/><text x="367" y="162" text-anchor="middle" fill="#c4efdf" font-family="Arial" font-size="13">chemical + neural signals</text>
<circle cx="505" cy="169" r="47" fill="#755386"/><path d="M482 164q22-26 45-1-19 0-19 25m-22-6q20-18 43-6" fill="none" stroke="#fff" stroke-width="4"/><text x="505" y="241" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">Brain</text>
<text x="320" y="330" text-anchor="middle" fill="#d6c6e0" font-family="Arial" font-size="14">Microbiome research is active; a pathway does not imply a simple one-way cause.</text>
</svg>
