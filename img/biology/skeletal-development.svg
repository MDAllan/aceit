<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Embryonic origins of the skeleton</title><desc id="desc">Paraxial mesoderm forms somites that contribute vertebrae and ribs; lateral plate mesoderm contributes limb bones; cranial neural crest contributes many facial bones.</desc>
<rect width="640" height="360" rx="24" fill="#152a35"/><text x="32" y="42" fill="#f0fbff" font-family="Arial" font-size="24" font-weight="700">Embryonic tissue sources</text>
<g font-family="Arial" text-anchor="middle"><rect x="34" y="91" width="172" height="68" rx="14" fill="#42596a"/><text x="120" y="120" fill="white" font-size="16">Paraxial mesoderm</text><text x="120" y="141" fill="#d2e0e8" font-size="13">somites</text>
<rect x="234" y="91" width="172" height="68" rx="14" fill="#42596a"/><text x="320" y="120" fill="white" font-size="16">Lateral plate</text><text x="320" y="141" fill="#d2e0e8" font-size="13">somatic mesoderm</text>
<rect x="434" y="91" width="172" height="68" rx="14" fill="#42596a"/><text x="520" y="120" fill="white" font-size="16">Cranial neural crest</text><text x="520" y="141" fill="#d2e0e8" font-size="13">pharyngeal arches</text></g>
<path d="M120 159v52m200-52v52m200-52v52" stroke="#e4d7b4" stroke-width="3"/>
<g font-family="Arial" text-anchor="middle"><rect x="44" y="211" width="152" height="73" rx="14" fill="#527e77"/><text x="120" y="241" fill="white" font-size="16">Axial skeleton</text><text x="120" y="263" fill="#e2ece9" font-size="13">vertebrae, ribs</text>
<rect x="244" y="211" width="152" height="73" rx="14" fill="#527e77"/><text x="320" y="241" fill="white" font-size="16">Limb skeleton</text><text x="320" y="263" fill="#e2ece9" font-size="13">appendicular bones</text>
<rect x="444" y="211" width="152" height="73" rx="14" fill="#527e77"/><text x="520" y="241" fill="white" font-size="16">Face and skull</text><text x="520" y="263" fill="#e2ece9" font-size="13">many facial bones</text></g>
<text x="320" y="326" text-anchor="middle" fill="#cad7df" font-family="Arial" font-size="14">Embryonic origin and ossification route are related but are not the same question.</text>
</svg>
