<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Hormonal regulation of digestion</title><desc id="desc">Acidic chyme in the duodenum stimulates secretin and bicarbonate release; fats and proteins stimulate CCK, bile release, and pancreatic enzymes.</desc>
<rect width="640" height="360" rx="24" fill="#241b32"/><text x="32" y="42" fill="#fff5ff" font-family="Arial" font-size="24" font-weight="700">Signals coordinate digestion</text>
<rect x="34" y="139" width="144" height="86" rx="14" fill="#755386"/><text x="106" y="172" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">Duodenum</text><text x="106" y="196" text-anchor="middle" fill="#ede1f0" font-family="Arial" font-size="13">chyme arrives</text>
<path d="M184 164H239m-12-9 12 9-12 9" stroke="#f0c77c" stroke-width="4" fill="none"/><text x="211" y="145" text-anchor="middle" fill="#f3d996" font-family="Arial" font-size="13">acid</text>
<rect x="247" y="91" width="158" height="66" rx="14" fill="#476f82"/><text x="326" y="119" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">Secretin</text><text x="326" y="141" text-anchor="middle" fill="#e3eef1" font-family="Arial" font-size="13">pancreatic bicarbonate</text>
<path d="M184 202H239m-12-9 12 9-12 9" stroke="#f0c77c" stroke-width="4" fill="none"/><text x="211" y="242" text-anchor="middle" fill="#f3d996" font-family="Arial" font-size="13">fat + protein</text>
<rect x="247" y="189" width="158" height="66" rx="14" fill="#8b5d58"/><text x="326" y="217" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">CCK</text><text x="326" y="239" text-anchor="middle" fill="#f3e7e4" font-family="Arial" font-size="13">bile + pancreatic enzymes</text>
<path d="M411 123H473m-12-9 12 9-12 9M411 221H473m-12-9 12 9-12 9" stroke="#a9e3ce" stroke-width="4" fill="none"/>
<rect x="480" y="115" width="123" height="114" rx="14" fill="#496d5c"/><text x="541" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15">Accessory</text><text x="541" y="179" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15">organs</text><text x="541" y="201" text-anchor="middle" fill="#dceddf" font-family="Arial" font-size="12">pancreas / gallbladder</text>
<text x="320" y="309" text-anchor="middle" fill="#d6c6e0" font-family="Arial" font-size="14">Neural reflexes and hormones adjust movement and secretion.</text>
</svg>
