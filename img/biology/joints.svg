<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Joint classification and synovial joint structure</title><desc id="desc">Fibrous joints allow little movement, cartilaginous joints allow limited movement, and synovial joints have a fluid-filled capsule for free movement.</desc>
<rect width="640" height="360" rx="24" fill="#152a35"/><text x="32" y="42" fill="#f0fbff" font-family="Arial" font-size="24" font-weight="700">Joint structure predicts movement</text>
<g font-family="Arial" text-anchor="middle"><rect x="35" y="91" width="174" height="78" rx="16" fill="#344c60"/><text x="122" y="121" fill="#f3f7fa" font-size="17">Fibrous</text><text x="122" y="146" fill="#cad7df" font-size="14">little / no movement</text>
<rect x="233" y="91" width="174" height="78" rx="16" fill="#41606c"/><text x="320" y="121" fill="#f3f7fa" font-size="17">Cartilaginous</text><text x="320" y="146" fill="#cad7df" font-size="14">limited movement</text>
<rect x="431" y="91" width="174" height="78" rx="16" fill="#3a7776"/><text x="518" y="121" fill="#f3f7fa" font-size="17">Synovial</text><text x="518" y="146" fill="#cad7df" font-size="14">freely movable</text></g>
<path d="M270 224v79m100-79v79" stroke="#eee2d0" stroke-width="28" stroke-linecap="round"/><path d="M319 225q19 28 0 52t0 26" fill="none" stroke="#56cfe1" stroke-width="10"/>
<path d="M255 212q67-29 132 0v108q-65 29-132 0z" fill="none" stroke="#f0b857" stroke-width="5"/>
<text x="434" y="232" fill="#f5d18f" font-family="Arial" font-size="15">Capsule</text><text x="434" y="260" fill="#8de5f5" font-family="Arial" font-size="15">Synovial fluid</text><text x="434" y="288" fill="#ece6d8" font-family="Arial" font-size="15">Articular cartilage</text>
</svg>
