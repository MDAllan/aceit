<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Bone remodeling and fracture healing</title><desc id="desc">Osteoclast resorption and osteoblast deposition remodel bone; fracture repair progresses through hematoma, soft callus, hard callus, and remodeling.</desc>
<rect width="640" height="360" rx="24" fill="#152a35"/><text x="32" y="42" fill="#f0fbff" font-family="Arial" font-size="24" font-weight="700">Bone is living and continually renewed</text>
<text x="320" y="96" fill="#8de5f5" font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">Remodeling</text>
<rect x="77" y="116" width="190" height="63" rx="16" fill="#374b5e"/><text x="172" y="154" fill="white" text-anchor="middle" font-family="Arial" font-size="16">Osteoclasts resorb bone</text>
<path d="M268 148H360" stroke="#f5d18f" stroke-width="4"/><path d="M350 138l14 10-14 10" fill="none" stroke="#f5d18f" stroke-width="4"/>
<rect x="373" y="116" width="190" height="63" rx="16" fill="#3c696d"/><text x="468" y="154" fill="white" text-anchor="middle" font-family="Arial" font-size="16">Osteoblasts form bone</text>
<text x="320" y="221" fill="#8de5f5" font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">Fracture repair: hematoma → soft callus → hard callus → remodeling</text>
<path d="M65 269H575" stroke="#a6b6c2" stroke-width="18" stroke-linecap="round"/><path d="M300 253l-14 17 20 9-14 18" fill="none" stroke="#f46c70" stroke-width="8"/><circle cx="306" cy="277" r="28" fill="#e28c72" opacity=".48"/>
<text x="320" y="328" fill="#cad7df" font-family="Arial" font-size="14" text-anchor="middle">Loading, calcium needs, and hormones influence the balance of resorption and deposition.</text>
</svg>
