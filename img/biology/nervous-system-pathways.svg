<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Nervous system information pathways</title><desc id="desc">Sensory information travels through afferent nerves to the central nervous system, and motor commands travel through efferent nerves to effectors.</desc>
<rect width="640" height="360" rx="24" fill="#241b32"/><text x="32" y="42" fill="#fff5ff" font-family="Arial" font-size="24" font-weight="700">Information flows through the nervous system</text>
<rect x="50" y="143" width="120" height="78" rx="16" fill="#426d84"/><text x="110" y="177" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">Sensory</text><text x="110" y="199" text-anchor="middle" fill="#e5eff2" font-family="Arial" font-size="13">receptor</text>
<rect x="258" y="127" width="142" height="110" rx="18" fill="#8460a0"/><text x="329" y="171" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17">CNS</text><text x="329" y="194" text-anchor="middle" fill="#f0e5f5" font-family="Arial" font-size="14">brain + spinal cord</text>
<rect x="473" y="143" width="120" height="78" rx="16" fill="#a96559"/><text x="533" y="177" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">Effector</text><text x="533" y="199" text-anchor="middle" fill="#f6e8e4" font-family="Arial" font-size="13">muscle / gland</text>
<path d="M176 170H248m-12-9 12 9-12 9M408 194h57m-12-9 12 9-12 9" stroke="#a9e3ce" stroke-width="4" fill="none"/>
<text x="212" y="146" text-anchor="middle" fill="#bcebd9" font-family="Arial" font-size="14">afferent</text><text x="436" y="222" text-anchor="middle" fill="#bcebd9" font-family="Arial" font-size="14">efferent</text>
<text x="320" y="295" text-anchor="middle" fill="#d6c6e0" font-family="Arial" font-size="14">PNS nerves connect the CNS with the rest of the body.</text>
</svg>
