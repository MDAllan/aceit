<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Energy changes form but the total is conserved</title><desc id="desc">A ball changes from gravitational potential energy at a high point to kinetic energy as it descends; friction transfers some energy to the surroundings as heat.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Energy changes form, total remains</text>
<path d="M65 263Q295 55 556 263" fill="none" stroke="#7186ad" stroke-width="8"/><circle cx="113" cy="186" r="19" fill="#ffbf52"/><circle cx="306" cy="113" r="19" fill="#ffbf52"/><circle cx="506" cy="205" r="19" fill="#ffbf52"/>
<path d="M115 153V112m-9 10 9-10 9 10" stroke="#d7c6ff" stroke-width="4" fill="none"/><path d="M329 126l36 25m-13-2 13 2-3-13" stroke="#9de0c7" stroke-width="4" fill="none"/>
<g font-family="Arial" font-size="14" fill="#f2f5ff"><text x="113" y="91" text-anchor="middle">More stored</text><text x="306" y="82" text-anchor="middle">Fastest motion</text><text x="512" y="158" text-anchor="middle">Some energy warms</text><text x="512" y="177" text-anchor="middle">the surroundings</text></g>
<rect x="132" y="287" width="376" height="30" rx="15" fill="#32415f"/><text x="320" y="307" text-anchor="middle" fill="#dbe5f4" font-family="Arial" font-size="14">potential + kinetic + thermal energy = conserved total</text>
</svg>
