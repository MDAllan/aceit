<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Momentum transfer in a collision</title><desc id="desc">Two carts approach, interact, and move apart; the system's total momentum remains the same when external forces are negligible.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Momentum is transferred, not lost</text>
<text x="155" y="96" text-anchor="middle" fill="#d4def2" font-family="Arial" font-size="16">Before</text><text x="476" y="96" text-anchor="middle" fill="#d4def2" font-family="Arial" font-size="16">After</text>
<path d="M67 233H257M383 233H573" stroke="#8796b7" stroke-width="4"/>
<rect x="98" y="185" width="63" height="46" rx="8" fill="#62a8d7"/><rect x="201" y="185" width="47" height="46" rx="8" fill="#e39b66"/><path d="M166 207h28m-11-8 11 8-11 8" stroke="#f3d18c" stroke-width="4" fill="none"/>
<path d="M285 207H355m-14-10 14 10-14 10" stroke="#f3d18c" stroke-width="4" fill="none"/>
<rect x="397" y="185" width="63" height="46" rx="8" fill="#62a8d7"/><rect x="495" y="185" width="47" height="46" rx="8" fill="#e39b66"/><path d="M376 207H346m11-8-11 8 11 8M557 207h33m-11-8 11 8-11 8" stroke="#8fe0ce" stroke-width="4" fill="none"/>
<text x="320" y="292" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="15">For an isolated system, total momentum before equals total momentum after.</text>
</svg>
