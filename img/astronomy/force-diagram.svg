<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Balanced and unbalanced forces</title><desc id="desc">Equal opposite forces leave a cart's motion unchanged; a larger net force produces acceleration in its direction.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Net force predicts acceleration</text>
<text x="165" y="103" text-anchor="middle" fill="#d4def2" font-family="Arial" font-size="17">Balanced</text><text x="476" y="103" text-anchor="middle" fill="#d4def2" font-family="Arial" font-size="17">Unbalanced</text>
<rect x="107" y="177" width="116" height="72" rx="12" fill="#536b93"/><path d="M62 213h38m-13-9 13 9-13 9M260 213h-34m9-9-9 9 9 9" stroke="#8fe0ce" stroke-width="5" fill="none"/>
<rect x="419" y="177" width="116" height="72" rx="12" fill="#536b93"/><path d="M357 213h54m-13-9 13 9-13 9" stroke="#ff9c77" stroke-width="5" fill="none"/>
<text x="165" y="290" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="15">Equal opposing forces</text><text x="476" y="290" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="15">Acceleration toward net force</text>
<text x="320" y="333" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="14">Mass measures inertia: the same net force changes a smaller mass more.</text>
</svg>
