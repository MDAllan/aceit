<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Gravity follows an inverse-square relationship</title><desc id="desc">Two masses twice as far apart experience one-quarter the gravitational force; three times as far apart means one-ninth the force.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Gravity weakens with distance squared</text>
<g fill="#e3ae5a"><circle cx="110" cy="186" r="34"/><circle cx="250" cy="186" r="34"/><circle cx="390" cy="186" r="34"/><circle cx="530" cy="186" r="34"/></g>
<g stroke="#91d8cb" stroke-width="4" fill="none"><path d="M153 186h55m-12-9 12 9-12 9M207 186h-55m12-9-12 9 12 9"/><path d="M433 186h55m-12-9 12 9-12 9M487 186h-55m12-9-12 9 12 9"/></g>
<g fill="#f2f5ff" font-family="Arial" text-anchor="middle"><text x="180" y="250" font-size="16">Distance d</text><text x="180" y="278" font-size="15">Force F</text><text x="460" y="250" font-size="16">Distance 2d</text><text x="460" y="278" font-size="15">Force F / 4</text></g>
<text x="320" y="326" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="14">Doubling the separation reduces gravitational force to one quarter.</text>
</svg>
