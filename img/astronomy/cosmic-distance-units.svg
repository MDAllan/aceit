<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Astronomical distance units</title><desc id="desc">Astronomical units are useful inside the solar system, while light-years describe much larger distances between stars and galaxies.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Choose a distance unit for the scale</text>
<path d="M78 202H562" stroke="#8292b6" stroke-width="3"/><circle cx="115" cy="202" r="20" fill="#ffbf52"/><circle cx="196" cy="202" r="9" fill="#66bfe7"/><circle cx="330" cy="202" r="14" fill="#e89c6d"/><circle cx="526" cy="202" r="22" fill="#a88be0"/>
<g fill="#f2f5ff" font-family="Arial" text-anchor="middle"><text x="115" y="246" font-size="15">Sun</text><text x="196" y="246" font-size="15">Earth</text><text x="330" y="246" font-size="15">Nearby star</text><text x="526" y="246" font-size="15">Galaxy</text></g>
<path d="M128 119H257" stroke="#71cbe6" stroke-width="5"/><path d="M247 109l12 10-12 10" fill="none" stroke="#71cbe6" stroke-width="4"/><text x="192" y="101" fill="#a5e8f4" text-anchor="middle" font-family="Arial" font-size="16">Astronomical unit (AU)</text>
<path d="M340 143H540" stroke="#d3a2f1" stroke-width="5"/><path d="M530 133l12 10-12 10" fill="none" stroke="#d3a2f1" stroke-width="4"/><text x="440" y="125" fill="#e2c9f8" text-anchor="middle" font-family="Arial" font-size="16">Light-year</text>
<text x="320" y="312" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="14">A light-year is a distance, not a time interval.</text>
</svg>
