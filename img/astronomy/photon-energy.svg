<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Photon energy and wavelength</title><desc id="desc">Shorter-wavelength violet light has higher-frequency, higher-energy photons than longer-wavelength red light.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Photon energy rises with frequency</text>
<g font-family="Arial" fill="#f2f5ff"><text x="72" y="117" font-size="17">Violet: shorter wavelength</text><text x="72" y="290" font-size="17">Red: longer wavelength</text></g>
<path d="M72 173q12-43 24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0" fill="none" stroke="#bd9bff" stroke-width="5"/>
<path d="M72 252q29-32 58 0t58 0t58 0t58 0t58 0t58 0t58 0t58 0t58 0" fill="none" stroke="#ff817e" stroke-width="5"/>
<text x="320" y="332" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="15">Higher frequency means more energy per photon.</text>
</svg>
