<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Forms and transfers of energy</title><desc id="desc">A moving object, a raised object, a warm surface, and emitted light represent kinetic, gravitational potential, thermal, and radiant energy.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Energy appears in different forms</text>
<g font-family="Arial" text-anchor="middle" fill="#f2f5ff">
<circle cx="106" cy="170" r="44" fill="#386e9a"/><path d="M66 170h-27m11-10-11 10 11 10M145 170h27m-11-10 11 10-11 10" stroke="#9de0c7" stroke-width="4" fill="none"/><text x="106" y="244" font-size="15">Kinetic</text><text x="106" y="265" font-size="13">motion</text>
<rect x="226" y="132" width="70" height="70" rx="10" fill="#755fa5"/><path d="M261 121V80m-10 12 10-12 10 12" stroke="#dac6ff" stroke-width="4" fill="none"/><text x="261" y="244" font-size="15">Potential</text><text x="261" y="265" font-size="13">stored by height</text>
<rect x="381" y="124" width="70" height="78" rx="10" fill="#a4574d"/><path d="M398 115q-10-15 0-27m18 27q-10-15 0-27m18 27q-10-15 0-27" stroke="#ffb88f" stroke-width="4" fill="none"/><text x="416" y="244" font-size="15">Thermal</text><text x="416" y="265" font-size="13">random particle motion</text>
<circle cx="548" cy="166" r="30" fill="#e1ae4e"/><g stroke="#ffe29a" stroke-width="4"><path d="M548 113v-21M548 240v-21M495 166h-21M622 166h-21M510 128l-15-15M601 219l-15-15M586 128l15-15M495 219l15-15"/></g><text x="548" y="244" font-size="15">Radiant</text><text x="548" y="265" font-size="13">light</text>
</g><text x="320" y="319" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="14">Energy can move between forms while the complete total is conserved.</text>
</svg>
