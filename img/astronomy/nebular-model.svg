<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Stages of solar system formation</title><desc id="desc">A cloud collapses under gravity, spins into a disk around a forming Sun, and material in the disk accumulates into planetesimals and planets.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">From cloud to planetary system</text>
<g font-family="Arial" text-anchor="middle"><circle cx="112" cy="170" r="52" fill="#36435e"/><g fill="#8ac4e8"><circle cx="84" cy="146" r="7"/><circle cx="131" cy="137" r="9"/><circle cx="124" cy="194" r="8"/><circle cx="90" cy="188" r="5"/></g><text x="112" y="250" fill="#d2dbee" font-size="15">Gas and dust</text>
<path d="M177 170h61m-13-10 13 10-13 10" stroke="#f4d18c" stroke-width="4" fill="none"/>
<ellipse cx="320" cy="170" rx="83" ry="33" fill="none" stroke="#687da8" stroke-width="15"/><circle cx="320" cy="170" r="22" fill="#ffbf52"/><text x="320" y="250" fill="#d2dbee" font-size="15">Rotating disk</text>
<path d="M408 170h61m-13-10 13 10-13 10" stroke="#f4d18c" stroke-width="4" fill="none"/>
<circle cx="530" cy="170" r="25" fill="#ffbf52"/><ellipse cx="530" cy="170" rx="67" ry="27" fill="none" stroke="#687da8" stroke-width="8"/><circle cx="490" cy="170" r="7" fill="#8bc1e5"/><circle cx="565" cy="170" r="11" fill="#e58e6c"/><circle cx="530" cy="197" r="5" fill="#a5d6e8"/><text x="530" y="250" fill="#d2dbee" font-size="15">Planetesimals grow</text></g>
<text x="320" y="310" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="14">A temperature gradient helps sort which materials condense at different distances.</text>
</svg>
