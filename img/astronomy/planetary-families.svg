<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Terrestrial and jovian planet comparison</title><desc id="desc">Comparison of small rocky inner planets with large hydrogen-rich outer planets and their different atmospheres, densities, and moon systems.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Two broad planet families</text>
<rect x="28" y="70" width="278" height="250" rx="18" fill="#22304d"/><rect x="334" y="70" width="278" height="250" rx="18" fill="#22304d"/>
<text x="167" y="105" text-anchor="middle" fill="#8dd8ff" font-family="Arial" font-size="21" font-weight="700">Terrestrial</text><text x="473" y="105" text-anchor="middle" fill="#ffd68a" font-family="Arial" font-size="21" font-weight="700">Jovian</text>
<g font-family="Arial" fill="#f3f6ff" font-size="16"><text x="54" y="143">• Mercury · Venus · Earth · Mars</text><text x="54" y="178">• Smaller and rocky</text><text x="54" y="213">• Higher average density</text><text x="54" y="248">• Thin or modest atmospheres</text><text x="54" y="283">• Few moons; no large ring systems</text>
<text x="360" y="143">• Jupiter · Saturn · Uranus · Neptune</text><text x="360" y="178">• Larger, with deep gaseous envelopes</text><text x="360" y="213">• Lower average density overall</text><text x="360" y="248">• Many moons and ring systems</text><text x="360" y="283">• Farther out, beyond the asteroid belt</text></g>
</svg>
