<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Robotic spacecraft mission types</title><desc id="desc">Four mission paths show a flyby passing a world, an orbiter circling it, a lander descending to the surface, and a rover moving across it.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Choose a mission for the science</text>
<g fill="none" stroke="#7383a8" stroke-width="3"><path d="M50 132Q150 64 246 132"/><path d="M349 119a48 48 0 1 1-1 0"/><path d="M509 72v104"/></g>
<circle cx="150" cy="140" r="24" fill="#d77b5f"/><circle cx="380" cy="126" r="30" fill="#66add0"/><circle cx="540" cy="154" r="30" fill="#ad846b"/>
<path d="M62 125l15-12 15 12-15 12zM316 107l13-10 13 10-13 10zM527 92l13-13 13 13-13 13z" fill="#ffe185"/>
<path d="M500 188Q539 178 580 188" fill="none" stroke="#a8cf8d" stroke-width="4"/><rect x="542" y="170" width="23" height="13" rx="3" fill="#f4c15d"/>
<g fill="#f4f6ff" font-family="Arial" font-size="17" text-anchor="middle"><text x="150" y="220">Flyby</text><text x="380" y="220">Orbiter</text><text x="540" y="220">Lander / rover</text></g>
<g fill="#c1cde3" font-family="Arial" font-size="14" text-anchor="middle"><text x="150" y="246">Brief encounter;</text><text x="150" y="265">many targets</text><text x="380" y="246">Repeated views;</text><text x="380" y="265">global mapping</text><text x="540" y="246">Direct surface or</text><text x="540" y="265">local measurements</text></g>
</svg>
