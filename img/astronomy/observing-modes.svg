<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Three astronomical observing modes</title><desc id="desc">Images map position and brightness, spectra break light into wavelengths, and light curves track brightness over time.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Three ways to record evidence</text>
<g font-family="Arial" text-anchor="middle"><text x="112" y="89" fill="#9ad7ff" font-size="18" font-weight="700">Image</text><text x="320" y="89" fill="#9ad7ff" font-size="18" font-weight="700">Spectrum</text><text x="528" y="89" fill="#9ad7ff" font-size="18" font-weight="700">Light curve</text></g>
<rect x="42" y="111" width="140" height="126" rx="12" fill="#1d2b49"/><circle cx="87" cy="155" r="14" fill="#ffcd75"/><circle cx="133" cy="194" r="22" fill="#956bda"/><circle cx="139" cy="143" r="6" fill="#eef2ff"/>
<rect x="250" y="111" width="140" height="126" rx="12" fill="#1d2b49"/><path d="M266 219H375" stroke="#95a7c7" stroke-width="2"/><path d="M266 214L284 199 300 183 317 146 335 202 351 165 368 122" fill="none" stroke="#76e0cc" stroke-width="4"/>
<rect x="458" y="111" width="140" height="126" rx="12" fill="#1d2b49"/><path d="M476 218H582M476 218V128" stroke="#95a7c7" stroke-width="2"/><path d="M477 151Q492 154 501 164T523 195T545 160T565 152T581 147" fill="none" stroke="#ff9d78" stroke-width="4"/>
<g fill="#c6d2e8" font-family="Arial" font-size="14" text-anchor="middle"><text x="112" y="274">Where and how bright?</text><text x="320" y="274">Which wavelengths?</text><text x="528" y="274">How does brightness change?</text></g>
</svg>
