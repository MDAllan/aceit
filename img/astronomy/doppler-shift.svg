<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Doppler shift of a spectral line</title><desc id="desc">A spectral line shifts to longer wavelengths when a source moves away and to shorter wavelengths when it approaches.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">Motion shifts a source's spectral lines</text>
<path d="M112 115H528" stroke="#8292b6" stroke-width="2"/><g stroke="#dce8f8" stroke-width="12"><path d="M330 95v40"/></g><text x="330" y="82" text-anchor="middle" fill="#dce8f8" font-family="Arial" font-size="15">At rest</text>
<path d="M112 205H528" stroke="#8292b6" stroke-width="2"/><path d="M390 185v40" stroke="#ff8f7e" stroke-width="12"/><path d="M330 205h48m-13-9 13 9-13 9" stroke="#ffad9d" stroke-width="4" fill="none"/><text x="390" y="174" text-anchor="middle" fill="#ffb2a5" font-family="Arial" font-size="15">Moving away: redshift</text>
<path d="M112 295H528" stroke="#8292b6" stroke-width="2"/><path d="M270 275v40" stroke="#9d8aff" stroke-width="12"/><path d="M330 295h-48m13-9-13 9 13 9" stroke="#bcaeff" stroke-width="4" fill="none"/><text x="270" y="264" text-anchor="middle" fill="#c6baff" font-family="Arial" font-size="15">Approaching: blueshift</text>
<text x="320" y="341" text-anchor="middle" fill="#c5cee3" font-family="Arial" font-size="13">Wavelength increases to the right; the shift reveals line-of-sight motion.</text>
</svg>
