<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Telescope image formation</title><desc id="desc">Parallel rays from a distant object enter a telescope aperture, are focused by a mirror, and converge at a detector in the focal plane.</desc>
<rect width="640" height="360" rx="24" fill="#101b35"/><text x="32" y="42" fill="#f3f6ff" font-family="Arial" font-size="24" font-weight="700">From incoming light to an image</text>
<path d="M54 120H430M54 178H430M54 236H430" stroke="#ffd277" stroke-width="3"/><path d="M430 98Q468 178 430 258" fill="none" stroke="#b8d5ff" stroke-width="8"/><path d="M430 120L512 177M430 178H512M430 236L512 179" fill="none" stroke="#6de0d4" stroke-width="3"/><rect x="506" y="151" width="14" height="54" rx="4" fill="#f5f6fa"/>
<g fill="#f3f6ff" font-family="Arial" font-size="16"><text x="64" y="100">Parallel rays from a distant source</text><text x="377" y="284">Primary mirror</text><text x="493" y="230">Detector</text><text x="477" y="135">Focus</text></g>
<circle cx="512" cy="178" r="5" fill="#ff705f"/>
</svg>
