<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Body waves and surface waves</title><desc id="desc">P waves compress and expand material and pass through solids and liquids; S waves shear solids only; Love and Rayleigh waves travel along the surface and can cause severe shaking.</desc>
<rect width="640" height="360" rx="24" fill="#192d3a"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Seismic waves differ in motion and path</text>
<g font-family="Arial" fill="#f2f8fc"><text x="55" y="113" font-size="16">P wave</text><text x="55" y="188" font-size="16">S wave</text><text x="55" y="263" font-size="16">Surface waves</text></g>
<path d="M152 106h390" stroke="#687f8e" stroke-width="2"/><g stroke="#75c5da" stroke-width="6"><path d="M180 87v38M203 93v26M229 80v52M254 93v26M283 87v38M310 93v26M336 80v52M361 93v26M389 87v38M416 93v26M442 80v52M467 93v26M494 87v38M522 93v26"/></g><text x="565" y="112" fill="#b9ebf5" font-family="Arial" font-size="13">push-pull</text>
<path d="M152 181h390" stroke="#687f8e" stroke-width="2"/><path d="M174 181q20-35 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="#d89cec" stroke-width="5"/><text x="565" y="187" fill="#efd5f7" font-family="Arial" font-size="13">side-to-side</text>
<path d="M152 256h390" stroke="#687f8e" stroke-width="5"/><path d="M152 251q20-20 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="#ffac78" stroke-width="5"/><path d="M202 244v-22m-8 8 8-8 8 8M329 263v19m-8-8 8 8 8-8M447 244v-22m-8 8 8-8 8 8" fill="none" stroke="#ffcf9f" stroke-width="3"/><text x="565" y="263" fill="#ffd7b7" font-family="Arial" font-size="13">surface motion</text>
<text x="320" y="319" text-anchor="middle" fill="#c5d5dd" font-family="Arial" font-size="14">P: solids + liquids · S: solids only · surface waves: often most damaging</text>
</svg>
