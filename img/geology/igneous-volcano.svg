<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Volcano and igneous rock formation</title><desc id="desc">Magma rises through a volcano, cooling slowly underground as intrusive rock or quickly at the surface as fine-grained extrusive rock.</desc>
<rect width="640" height="360" rx="24" fill="#25252b"/><text x="32" y="42" fill="#f8f2f0" font-family="Arial" font-size="24" font-weight="700">Magma cooling sets igneous texture</text>
<path d="M68 275L240 114l172 161z" fill="#796253" stroke="#cfb49b" stroke-width="3"/><path d="M220 125l20-42 20 42" fill="#dd7557"/><path d="M240 125v116" stroke="#f59d68" stroke-width="13"/><ellipse cx="240" cy="257" rx="88" ry="27" fill="#dc7657" opacity=".8"/>
<path d="M258 202l93-52 37 25-92 59" fill="#8e6e5c" stroke="#d0b59b" stroke-width="3"/><path d="M258 202l92-52" stroke="#f5a66c" stroke-width="7"/>
<g fill="#f4eee9" font-family="Arial" font-size="15"><text x="62" y="311">Surface lava cools quickly</text><text x="364" y="112">Intrusion cools slowly</text><text x="379" y="215">Crystal size records</text><text x="379" y="237">cooling history</text></g>
<circle cx="126" cy="249" r="4" fill="#f3d9b8"/><circle cx="142" cy="232" r="4" fill="#f3d9b8"/><circle cx="159" cy="249" r="4" fill="#f3d9b8"/><circle cx="179" cy="231" r="4" fill="#f3d9b8"/>
