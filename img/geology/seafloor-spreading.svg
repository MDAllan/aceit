<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Evidence for seafloor spreading</title><desc id="desc">New seafloor forms at a ridge, then moves away on both sides, creating symmetric magnetic stripes and older crust farther from the ridge.</desc>
<rect width="640" height="360" rx="24" fill="#142b3c"/><text x="32" y="42" fill="#effaff" font-family="Arial" font-size="24" font-weight="700">Ridge records move apart symmetrically</text>
<path d="M45 178h190l85-45 85 45h190v92H45z" fill="#31556a"/><path d="M235 178l85-45 85 45" fill="none" stroke="#e6c07b" stroke-width="6"/>
<path d="M235 178H70M405 178h165" stroke="#a9d8e5" stroke-width="3" stroke-dasharray="14 12"/>
<g fill="#8196aa"><rect x="249" y="178" width="22" height="92"/><rect x="293" y="156" width="22" height="114"/><rect x="337" y="156" width="22" height="114"/><rect x="381" y="178" width="22" height="92"/></g>
<path d="M279 103H186m186 0h93" stroke="#f3f1e7" stroke-width="4"/><path d="M186 103l15-9m-15 9 15 9m258-9-15-9m15 9-15 9" stroke="#f3f1e7" stroke-width="3"/>
<g fill="#eaf3f7" font-family="Arial" font-size="15" text-anchor="middle"><text x="320" y="93">New crust</text><text x="121" y="305">Older seafloor</text><text x="518" y="305">Older seafloor</text></g>
<text x="320" y="335" text-anchor="middle" fill="#c9d8e2" font-family="Arial" font-size="14">Matching magnetic stripes and increasing age away from the ridge support spreading.</text>
</svg>
