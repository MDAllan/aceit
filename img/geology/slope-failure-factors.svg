<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Conditions that can destabilize a slope</title><desc id="desc">A slope diagram shows gravity pulling material downslope, water entering pores, and a weak layer acting as a possible failure surface.</desc>
<rect width="640" height="360" rx="24" fill="#29251f"/><text x="32" y="42" fill="#fff6e8" font-family="Arial" font-size="24" font-weight="700">Why slopes become unstable</text>
<path d="M66 281L304 114 574 114V281Z" fill="#886b48"/><path d="M66 281L304 114" stroke="#d8b47d" stroke-width="5"/>
<path d="M353 139L245 215" stroke="#f0cf75" stroke-width="7" stroke-dasharray="9 7"/><text x="360" y="156" fill="#f3dc98" font-family="Arial" font-size="15">Weak layer</text>
<path d="M471 80v80m0 0-10-15m10 15 10-15M514 80v80m0 0-10-15m10 15 10-15" stroke="#75cfe1" stroke-width="4"/><text x="472" y="68" text-anchor="middle" fill="#a5e8f4" font-family="Arial" font-size="14">Water enters pores</text>
<path d="M213 190L266 152" stroke="#f18d68" stroke-width="5"/><path d="M253 151l16-3-7 14" fill="#f18d68"/><text x="111" y="176" fill="#ffd1b6" font-family="Arial" font-size="15">Gravity pulls downslope</text>
<path d="M133 250q-34-21-31-48m64 41q-31-29-18-56m-63 95q-36-16-37-40" fill="none" stroke="#8fd0df" stroke-width="4"/>
<text x="320" y="326" text-anchor="middle" fill="#e5d6bd" font-family="Arial" font-size="14">Steeper slopes, water, weak material, and added load can reduce stability.</text>
</svg>
