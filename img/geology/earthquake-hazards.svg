<rect x="76" y="140" width="70" height="86" fill="#8d5f57"/><path d="M67 140l44-36 44 36" fill="#c07d5c"/><path d="M90 168h16v20H90zm28 0h12v20h-12" fill="#f5d9a2"/><text x="111" y="287" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">building damage</text>
