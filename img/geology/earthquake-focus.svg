<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Hypocenter and epicenter</title><desc id="desc">The hypocenter is the underground point where rupture begins; the epicenter lies on the surface directly above it.</desc>
<rect width="640" height="360" rx="24" fill="#192d3a"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Two earthquake locations, different depths</text>
<path d="M47 148h546" stroke="#8fe0ce" stroke-width="5"/><path d="M47 153v148h546V153" fill="#4a6971" opacity=".65"/>
<path d="M300 190l118 80" stroke="#cda873" stroke-width="10"/><path d="M315 200l-28 78" stroke="#f4a16f" stroke-width="5"/>
<circle cx="300" cy="190" r="13" fill="#ffb775" stroke="#fff1d2" stroke-width="3"/><circle cx="300" cy="148" r="11" fill="#74d2cf" stroke="#e8ffff" stroke-width="3"/>
<path d="M300 160v18m-8-8 8 8 8-8" stroke="#ecf8f6" stroke-width="3" fill="none"/>
<g font-family="Arial" fill="#f4f8fa"><text x="327" y="142" font-size="16">Epicenter</text><text x="327" y="185" font-size="16">Hypocenter / focus</text><text x="427" y="271" font-size="15">Fault plane</text></g>
<path d="M323 148h42M313 190h57" stroke="#c9d7de" stroke-width="2"/>
<text x="320" y="325" text-anchor="middle" fill="#c5d5dd" font-family="Arial" font-size="15">The epicenter is directly above the underground point where rupture begins.</text>
</svg>
