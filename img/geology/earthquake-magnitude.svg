<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Earthquake size scales measure different things</title><desc id="desc">Moment magnitude estimates earthquake size from rupture properties, local Richter magnitude uses wave amplitude near the epicenter, and Mercalli describes observed effects.</desc>
<rect width="640" height="360" rx="24" fill="#192d3a"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Know what each earthquake scale describes</text>
<rect x="44" y="92" width="172" height="188" rx="18" fill="#315c68"/><text x="130" y="130" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Moment magnitude</text><text x="130" y="164" text-anchor="middle" fill="#dbecef" font-family="Arial" font-size="15">Mw</text><path d="M78 207h104" stroke="#8fe0ce" stroke-width="4"/><circle cx="103" cy="207" r="7" fill="#ffcb77"/><circle cx="155" cy="207" r="12" fill="#ffcb77"/><text x="130" y="251" text-anchor="middle" fill="#dbecef" font-family="Arial" font-size="13">rupture-based size</text>
<rect x="234" y="92" width="172" height="188" rx="18" fill="#725741"/><text x="320" y="130" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Local magnitude</text><text x="320" y="164" text-anchor="middle" fill="#f2e7d8" font-family="Arial" font-size="15">ML / Richter</text><path d="M270 218h100" stroke="#f0c77c" stroke-width="3"/><path d="M320 190v56" stroke="#ffb273" stroke-width="8"/><text x="320" y="267" text-anchor="middle" fill="#f2e7d8" font-family="Arial" font-size="12">wave amplitude, near source</text>
<rect x="424" y="92" width="172" height="188" rx="18" fill="#674957"/><text x="510" y="130" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Mercalli</text><text x="510" y="164" text-anchor="middle" fill="#f5e4ec" font-family="Arial" font-size="15">intensity</text><path d="M461 218h98" stroke="#d6b4c5" stroke-width="3"/><rect x="465" y="204" width="17" height="14" fill="#8fe0ce"/><rect x="490" y="190" width="17" height="28" fill="#e9c66c"/><rect x="515" y="176" width="17" height="42" fill="#ed956e"/><text x="510" y="255" text-anchor="middle" fill="#f5e4ec" font-family="Arial" font-size="12">observed effects locally</text>
<text x="320" y="324" text-anchor="middle" fill="#c5d5dd" font-family="Arial" font-size="14">A one-unit magnitude step is ten times the wave amplitude.</text>
</svg>
