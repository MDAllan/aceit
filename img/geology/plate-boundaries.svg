<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Three plate-boundary motions</title><desc id="desc">Convergent plates move toward each other, divergent plates move apart, and transform plates slide past one another.</desc>
<rect width="640" height="360" rx="24" fill="#1c2a38"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Plate boundary motion</text>
<g font-family="Arial" text-anchor="middle"><text x="110" y="95" fill="#f4ca8b" font-size="18">Convergent</text><text x="320" y="95" fill="#f4ca8b" font-size="18">Divergent</text><text x="530" y="95" fill="#f4ca8b" font-size="18">Transform</text></g>
<path d="M35 173H107l35 45h28l35-45h40" fill="#ba705c" stroke="#e8c9a9" stroke-width="3"/><path d="M40 143h82M238 143h-82" stroke="#f4f1e9" stroke-width="4"/><path d="M40 143l16-9m-16 9 16 9M238 143l-16-9m16 9-16 9" stroke="#f4f1e9" stroke-width="3"/>
<path d="M245 173h53l22-22 22 22h53" fill="#a55e4f" stroke="#e8c9a9" stroke-width="3"/><path d="M258 143h48M382 143h-48" stroke="#f4f1e9" stroke-width="4"/><path d="M258 143l16-9m-16 9 16 9M382 143l-16-9m16 9-16 9" stroke="#f4f1e9" stroke-width="3"/>
<path d="M430 173h175v45H430z" fill="#a55e4f" stroke="#e8c9a9" stroke-width="3"/><path d="M506 173v45" stroke="#f4f1e9" stroke-width="3" stroke-dasharray="6 6"/><path d="M460 154v-28m0 0-9 13m9-13 9 13M567 236v28m0 0-9-13m9 13 9-13" stroke="#f4f1e9" stroke-width="4"/>
<g fill="#cbd6e2" font-family="Arial" font-size="14" text-anchor="middle"><text x="110" y="284">Compression; subduction</text><text x="320" y="284">Extension; new crust</text><text x="530" y="284">Lateral shear; crust preserved</text></g>
</svg>
