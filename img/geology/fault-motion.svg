<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Three principal fault motions</title><desc id="desc">Normal faults move the hanging wall down, reverse faults move it up, and strike-slip faults move blocks sideways.</desc>
<rect width="640" height="360" rx="24" fill="#192d3a"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Fault names describe block motion</text>
<g font-family="Arial" text-anchor="middle" fill="#f2f8fc"><text x="118" y="91" font-size="16">Normal</text><text x="320" y="91" font-size="16">Reverse / thrust</text><text x="522" y="91" font-size="16">Strike-slip</text></g>
<path d="M43 235h104v-65H43zM147 170l51 65v-65z" fill="#658092" stroke="#d4e0e5" stroke-width="2"/><path d="M147 170l-51 65" stroke="#f1c96e" stroke-width="5"/><path d="M169 146v33m-8-10 8 10 8-10" fill="none" stroke="#ff9e7a" stroke-width="4"/><text x="166" y="134" fill="#ffb098" font-family="Arial" font-size="12">hanging wall down</text>
<path d="M244 235h104v-65H244zM348 170l51 65v-65z" fill="#658092" stroke="#d4e0e5" stroke-width="2"/><path d="M348 170l-51 65" stroke="#f1c96e" stroke-width="5"/><path d="M369 204v-34m-8 10 8-10 8 10" fill="none" stroke="#8fe0ce" stroke-width="4"/><text x="373" y="225" fill="#a5efdb" font-family="Arial" font-size="12">hanging wall up</text>
<path d="M451 166h75v74h-75zM526 166h75v74h-75z" fill="#658092" stroke="#d4e0e5" stroke-width="2"/><path d="M526 166v74" stroke="#f1c96e" stroke-width="5"/><path d="M486 200h30m-10-8 10 8-10 8M566 213h-30m10-8-10 8 10 8" fill="none" stroke="#c5a5ed" stroke-width="4"/>
<text x="320" y="307" text-anchor="middle" fill="#c5d5dd" font-family="Arial" font-size="15">Extension → normal · compression → reverse · lateral shear → strike-slip</text>
</svg>
