<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Plate motion and the Wilson cycle</title><desc id="desc">A cycle links continental rifting, ocean-basin opening, subduction, basin closure, and continental collision.</desc>
<rect width="640" height="360" rx="24" fill="#1c2a38"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">A recurring cycle of ocean basins</text>
<g font-family="Arial" text-anchor="middle" fill="#f2f8fc"><rect x="44" y="91" width="150" height="67" rx="15" fill="#4a7880"/><text x="119" y="119" font-size="16">Continental</text><text x="119" y="141" font-size="16">rifting</text>
<rect x="245" y="91" width="150" height="67" rx="15" fill="#41708b"/><text x="320" y="119" font-size="16">Ocean basin</text><text x="320" y="141" font-size="16">opens</text>
<rect x="446" y="91" width="150" height="67" rx="15" fill="#a16b59"/><text x="521" y="119" font-size="16">Subduction</text><text x="521" y="141" font-size="16">begins</text>
<rect x="347" y="227" width="150" height="67" rx="15" fill="#a16b59"/><text x="422" y="255" font-size="16">Ocean basin</text><text x="422" y="277" font-size="16">closes</text>
<rect x="143" y="227" width="150" height="67" rx="15" fill="#8a6e52"/><text x="218" y="255" font-size="16">Continents</text><text x="218" y="277" font-size="16">collide</text></g>
<g fill="none" stroke="#e8d39e" stroke-width="3"><path d="M194 124h48m-10-10 10 10-10 10"/><path d="M395 124h48m-10-10 10 10-10 10"/><path d="M521 159q7 48-56 68m14-13 2 14 12-9"/><path d="M346 261h-48m10-10-10 10 10 10"/><path d="M143 261Q50 239 70 160m-7 12 7-12 8 12"/></g>
<text x="320" y="330" text-anchor="middle" fill="#cbd6e2" font-family="Arial" font-size="14">Internal heat and gravity drive plate motion through time.</text>
</svg>
