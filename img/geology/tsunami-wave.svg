<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Tsunami wavelength and coastal amplification</title><desc id="desc">A tsunami has a long wavelength and moves the full depth of ocean water; its speed decreases in shallow water while wave height and coastal flooding increase.</desc>
<rect width="640" height="360" rx="24" fill="#132f45"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Tsunami: small offshore, dangerous ashore</text>
<path d="M35 145q58-18 116 0t116 0t116 0t116 0t116 0v145H35z" fill="#267f9a"/><path d="M35 145q58-18 116 0t116 0t116 0t116 0t116 0" fill="none" stroke="#8fe1e8" stroke-width="5"/>
<path d="M482 146l74-9 42-38v191H482z" fill="#9b795a"/><path d="M497 136q35-50 67-23" fill="none" stroke="#baf4f1" stroke-width="5"/>
<path d="M100 188v73m-8-13 8 13 8-13M257 188v73m-8-13 8 13 8-13M416 188v73m-8-13 8 13 8-13" fill="none" stroke="#d7eff2" stroke-width="3"/>
<path d="M88 115h355m-14-10 14 10-14 10" stroke="#f4d184" stroke-width="3" fill="none"/><text x="264" y="103" text-anchor="middle" fill="#ffe4a8" font-family="Arial" font-size="14">very long wavelength across the ocean</text>
<text x="260" y="282" text-anchor="middle" fill="#e1f4f6" font-family="Arial" font-size="13">full water column moves</text><text x="550" y="311" text-anchor="middle" fill="#fff0cf" font-family="Arial" font-size="13">shallow coast</text>
<text x="320" y="337" text-anchor="middle" fill="#c5d5dd" font-family="Arial" font-size="14">Long warning distance does not mean the shore is safe: move to high ground.</text>
</svg>
