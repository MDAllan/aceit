<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Evidence for continental drift</title><desc id="desc">Matching continental margins and matching fossil and glacial evidence support continents having once been joined.</desc>
<rect width="640" height="360" rx="24" fill="#192d3a"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Independent clues for continental drift</text>
<path d="M66 117q45-30 82 0l-10 34 19 24-34 34-48-15-22-35z" fill="#79a97c" stroke="#d7e6cc" stroke-width="3"/><path d="M225 117q-45-30-82 0l10 34-19 24 34 34 48-15 22-35z" fill="#79a97c" stroke="#d7e6cc" stroke-width="3"/>
<text x="147" y="261" text-anchor="middle" fill="#cbd6e2" font-family="Arial" font-size="14">Complementary margins</text>
<path d="M319 180H376" stroke="#f4d189" stroke-width="4"/><path d="M365 170l14 10-14 10" fill="none" stroke="#f4d189" stroke-width="4"/>
<rect x="402" y="102" width="190" height="67" rx="14" fill="#30495a"/><text x="497" y="130" text-anchor="middle" fill="#f3f7fa" font-family="Arial" font-size="16">Matching fossils</text><text x="497" y="151" text-anchor="middle" fill="#cbd6e2" font-family="Arial" font-size="13">across ocean basins</text>
<rect x="402" y="187" width="190" height="67" rx="14" fill="#30495a"/><text x="497" y="215" text-anchor="middle" fill="#f3f7fa" font-family="Arial" font-size="16">Glacial deposits</text><text x="497" y="236" text-anchor="middle" fill="#cbd6e2" font-family="Arial" font-size="13">in now-warm regions</text>
<text x="320" y="313" text-anchor="middle" fill="#d7e2ea" font-family="Arial" font-size="14">The fit is stronger when several independent observations agree.</text>
</svg>
