<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Metamorphic change without melting</title><desc id="desc">Heat, pressure, and chemically active fluids transform pre-existing rock into metamorphic rock while the rock remains solid.</desc>
<rect width="640" height="360" rx="24" fill="#25252b"/><text x="32" y="42" fill="#f8f2f0" font-family="Arial" font-size="24" font-weight="700">Rock changes while remaining solid</text>
<rect x="44" y="133" width="155" height="95" rx="15" fill="#53636b"/><text x="121" y="170" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17">Parent rock</text><text x="121" y="196" text-anchor="middle" fill="#dbe4e8" font-family="Arial" font-size="14">minerals + texture</text>
<path d="M207 181H290m-13-10 13 10-13 10" stroke="#f3d18c" stroke-width="4" fill="none"/>
<rect x="303" y="111" width="144" height="139" rx="15" fill="#735b59"/><text x="375" y="145" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">Heat</text><text x="375" y="174" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">Pressure</text><text x="375" y="203" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16">Fluids</text>
<path d="M453 181H505m-13-10 13 10-13 10" stroke="#f3d18c" stroke-width="4" fill="none"/>
<rect x="515" y="133" width="92" height="95" rx="15" fill="#a16f62"/><path d="M532 202l21-37 18 19 20-31" fill="none" stroke="#f2d19a" stroke-width="5"/><text x="561" y="250" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">New texture</text>
<text x="320" y="311" text-anchor="middle" fill="#d7d0ca" font-family="Arial" font-size="15">If the rock melts and later solidifies, it enters the igneous cycle instead.</text>
</svg>
