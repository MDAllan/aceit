<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Elastic strain and earthquake rupture</title><desc id="desc">Rocks on either side of a locked fault bend elastically as stress builds, then slip suddenly and release stored elastic strain energy.</desc>
<rect width="640" height="360" rx="24" fill="#192d3a"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Earthquake cycle: strain, then slip</text>
<text x="162" y="96" text-anchor="middle" fill="#dbe7ed" font-family="Arial" font-size="16">Locked fault: strain builds</text><text x="476" y="96" text-anchor="middle" fill="#dbe7ed" font-family="Arial" font-size="16">Rupture: blocks rebound</text>
<path d="M56 157l180 30M56 217l180 30M236 187l-30 60" fill="none" stroke="#88a8b8" stroke-width="8"/><path d="M75 186h42m-11-9 11 9-11 9M217 218h-42m11-9-11 9 11 9" stroke="#f0c77c" stroke-width="4" fill="none"/>
<path d="M369 157l172 45M369 217l172-45M445 177l-30 60" fill="none" stroke="#88a8b8" stroke-width="8"/><path d="M399 199h-42m11-9-11 9 11 9M511 201h42m-11-9 11 9-11 9" stroke="#8fe0ce" stroke-width="4" fill="none"/>
<text x="320" y="302" text-anchor="middle" fill="#c5d5dd" font-family="Arial" font-size="15">Friction can lock a fault; sudden slip releases stored elastic deformation as seismic waves.</text>
</svg>
