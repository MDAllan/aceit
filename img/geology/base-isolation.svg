<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Base isolation reduces building motion</title><desc id="desc">Flexible bearings between the foundation and a building allow the ground to move with less motion transferred into the structure.</desc>
<rect width="640" height="360" rx="24" fill="#192d3a"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Base isolation limits motion transfer</text>
<text x="165" y="93" text-anchor="middle" fill="#dbe7ed" font-family="Arial" font-size="16">Ground-connected building</text><text x="467" y="93" text-anchor="middle" fill="#dbe7ed" font-family="Arial" font-size="16">Base-isolated building</text>
<path d="M46 270q24-18 48 0t48 0t48 0t48 0" fill="none" stroke="#e9bc67" stroke-width="5"/><path d="M347 270q24-18 48 0t48 0t48 0t48 0t48 0" fill="none" stroke="#e9bc67" stroke-width="5"/>
<rect x="105" y="151" width="118" height="101" fill="#796459" stroke="#e2d5cb" stroke-width="2"/><path d="M92 151l72-53 72 53" fill="#bc7e5d" stroke="#e2d5cb" stroke-width="2"/><path d="M164 151v101M108 184h112M108 217h112" stroke="#d7c6ba" stroke-width="2"/>
<rect x="401" y="151" width="118" height="101" fill="#796459" stroke="#e2d5cb" stroke-width="2"/><path d="M388 151l72-53 72 53" fill="#bc7e5d" stroke="#e2d5cb" stroke-width="2"/><path d="M460 151v101M404 184h112M404 217h112" stroke="#d7c6ba" stroke-width="2"/>
<path d="M103 255h122" stroke="#f4aa75" stroke-width="8"/><path d="M398 255h124" stroke="#83d8c8" stroke-width="5"/><path d="M415 262q8-11 16 0t16 0t16 0t16 0t16 0t16 0" fill="none" stroke="#83d8c8" stroke-width="3"/>
<text x="164" y="299" text-anchor="middle" fill="#f4c3a7" font-family="Arial" font-size="13">more motion transmitted</text><text x="460" y="299" text-anchor="middle" fill="#aeece0" font-family="Arial" font-size="13">less motion transferred</text>
<text x="320" y="332" text-anchor="middle" fill="#c5d5dd" font-family="Arial" font-size="14">Isolation reduces shaking in a building; it does not prevent an earthquake.</text>
</svg>
