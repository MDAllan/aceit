<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Earth's density and temperature structure</title><desc id="desc">A cutaway Earth shows a thin crust, mantle, liquid outer core, and solid inner core, with density and temperature increasing inward.</desc>
<rect width="640" height="360" rx="24" fill="#192d3a"/><text x="32" y="42" fill="#f2f8fc" font-family="Arial" font-size="24" font-weight="700">Earth changes with depth</text>
<circle cx="250" cy="197" r="118" fill="#8f5849"/><circle cx="250" cy="197" r="80" fill="#dc8d56"/><circle cx="250" cy="197" r="48" fill="#eacb72"/><circle cx="250" cy="197" r="25" fill="#fff0b1"/>
<path d="M323 118L440 85M325 154L440 144M297 206L440 214M263 230L440 275" stroke="#dbe7ed" stroke-width="2"/>
<g fill="#f3f7fa" font-family="Arial" font-size="16"><text x="450" y="91">Crust</text><text x="450" y="150">Mantle</text><text x="450" y="220">Liquid outer core</text><text x="450" y="281">Solid inner core</text></g>
<text x="250" y="343" text-anchor="middle" fill="#cedce4" font-family="Arial" font-size="14">Pressure, density, and temperature generally rise toward the centre.</text>
</svg>
