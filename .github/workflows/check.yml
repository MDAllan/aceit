name: content-and-logic-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Content checks (JSON, ids, answers, images, manifest, student-safe text)
        run: python tools/check_content.py
      - name: SQL copies are in step (patch6 = RUN-ME-2 = end of schema)
        run: python tools/build_sql.py --check
      - name: The app calls database functions with the right arguments
        run: python tools/check_rpc.py
      - name: JavaScript syntax
        run: for f in js/*.js config.js; do node --input-type=module --check < "$f"; done
      - name: Logic tests (calculators, spaced repetition)
        run: node tools/test_logic.mjs
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install a throwaway Postgres
        run: npm i --no-save embedded-postgres pg
      - name: Database security rules (fresh install)
        run: node tools/test_sql.mjs
      - name: Database security rules (upgrade from the first schema)
        run: MODE=upgrade node tools/test_sql.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install the browser test driver
        run: npm i --no-save puppeteer-core axe-core
      - name: Serve the site and run the browser tests (staff screens, real code paths, two-step login, content security policy, accessibility scan)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          CI=1 CHROME=/usr/bin/google-chrome node tools/browser/run.mjs
