name: content-and-logic-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Content checks (JSON, ids, answers, images, manifest, student-safe text)
        run: python tools/check_content.py
      - name: JavaScript syntax
        run: for f in js/*.js config.js; do node --input-type=module --check < "$f"; done
      - name: Logic tests (calculators, spaced repetition)
        run: node tools/test_logic.mjs
